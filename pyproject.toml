[project]
name = "bank-to-ofx"
version = "0.1.0"
description = "Convert bank statements from Desjardins (CSV and credit card PDF) and Wealthsimple into OFX per account, with monthly statement splitting"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pdfplumber>=0.11.10",
    "python-dateutil>=2.9.0.post0",
]

[tool.uv]
package = true

[project.scripts]
bank-to-ofx = "bank_to_ofx.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bank_to_ofx*"]
